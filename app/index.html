<style>

.banner{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 14px;font-weight:500}

.x{all:unset;cursor:pointer;width:36px;height:36px;display:grid;place-items:center;border-radius:8px;font-size:20px;color:var(--muted)}

.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}

.field textarea{min-height:80px;resize:vertical}
.field input:disabled,.field select:disabled,.field textarea:disabled{opacity:.8}

.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.log{display:flex;flex-direction:column;gap:8px}
.log div{border-left:2px solid var(--accent);padding-left:10px}
.gate{max-width:520px;margin:10vh auto 0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px;display:flex;flex-direction:column;gap:12px;text-align:center}

async function save(coll, id, data, merge) {

    const ref = id ? db.collection(coll).doc(id) : db.collection(coll).doc();
    const body = JSON.parse(JSON.stringify({...data, id: undefined, majLe: new Date().toISOString(), majPar: ME.id || undefined}));
    if (merge) await ref.update(body); else await ref.set(body);
    return ref.id;
  } catch (e) {
    toast(e && e.code === 'quota_exceeded' ? 'Limite de stockage atteinte : supprimez des fiches anciennes.' : e && e.code === 'invalid_argument' ? 'Vous n\'avez pas le droit d\'enregistrer ici.' : 'Enregistrement échoué, réessayez.');
    throw e;
  }
}

let lastFocus = null;
function closeModal() { $('#modal-root').innerHTML = ''; if (lastFocus && document.contains(lastFocus)) lastFocus.focus(); }
function modal({title, body, footer = '', wide = false}) {
  if (!$('#modal-root').innerHTML) lastFocus = document.activeElement;
  $('#modal-root').innerHTML = `<div class="overlay"><div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true" aria-labelledby="mt"><header><h3 id="mt">${esc(title)}</h3><button class="x" type="button" aria-label="Fermer">×</button></header><div class="content">${body}</div>${footer ? `<footer>${footer}</footer>` : ''}</div></div>`;
  const ov = $('#modal-root .overlay');

  return ov;
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if ($('#modal-root').innerHTML) closeModal(); else closeSide(); } });

function fieldHtml(f, v, ro) {
  const id = 'f-' + f.k, req = f.req ? ' required' : '', full = f.full || f.type === 'textarea' ? ' full' : '', dis = ro ? ' disabled' : '';
  let input;
  if (f.type === 'select') {
    const opts = typeof f.options === 'function' ? f.options() : f.options;
    input = `<select id="${id}" name="${f.k}"${req}${dis}><option value="">${esc(f.placeholder || '— Choisir —')}</option>${opts.map(o => { const [val, lab] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(val)}"${String(val) === String(v ?? '') ? ' selected' : ''}>${esc(lab)}</option>`; }).join('')}</select>`;
  } else if (f.type === 'textarea') input = `<textarea id="${id}" name="${f.k}"${req}${dis}>${esc(v)}</textarea>`;
  else if (f.type === 'check') input = `<label style="display:flex;gap:8px;align-items:center;font-weight:500;color:var(--ink);min-height:40px"><input id="${id}" name="${f.k}" type="checkbox" style="width:18px;height:18px;accent-color:var(--accent)"${v ? ' checked' : ''}${dis}> ${esc(f.text || 'Oui')}</label>`;
  else input = `<input id="${id}" name="${f.k}" type="${f.type || 'text'}" value="${esc(v)}"${req}${dis}${f.type === 'tel' ? ' inputmode="tel" placeholder="07 07 12 34 56"' : ''}${f.type === 'number' ? ' inputmode="numeric" min="0" step="1"' : ''}${f.ph ? ` placeholder="${esc(f.ph)}"` : ''}>`;
  const lab = f.type === 'check' ? `<label>${esc(f.label)}</label>` : `<label for="${id}">${esc(f.label)}${f.req ? ' *' : ''}</label>`;
  return `<div class="field${full}">${lab}${input}${f.hint ? `<span class="muted" style="font-size:12px">${esc(f.hint)}</span>` : ''}</div>`;
}
function readForm(form, fields) {
  const d = {};
  fields.forEach(f => {
    const el = form.elements[f.k];
    if (f.type === 'check') d[f.k] = el.checked;
    else if (f.type === 'number') d[f.k] = el.value === '' ? '' : Number(el.value);
    else if (f.type === 'tel') d[f.k] = el.value.trim() ? phone(el.value) : '';
    else d[f.k] = (el.value || '').trim();
  });
  return d;
}
function openForm({title, fields, values = {}, submit = 'Enregistrer', onSubmit, onDelete, readOnly = false, extra = '', wide = false}) {
  const ov = modal({
    title, wide,
    body: `${readOnly ? '<p class="banner info" style="margin:0">Consultation seule : votre rôle ne permet pas de modifier cette fiche.</p>' : ''}<form id="mform" class="form" novalidate>${fields.map(f => fieldHtml(f, values[f.k], readOnly)).join('')}</form>${extra}<p class="err" id="merr" hidden></p>`,
    footer: readOnly ? `<span></span><button class="btn" type="button" data-cancel>Fermer</button>` : `<div>${onDelete ? `<button class="btn danger" type="button" id="mdel">Supprimer</button>` : ''}</div><div class="actions"><button class="btn" type="button" data-cancel>Annuler</button><button class="btn primary" type="submit" form="mform" id="msub">${esc(submit)}</button></div>`
  });
  ov.querySelector('[data-cancel]').onclick = closeModal;
  const form = ov.querySelector('#mform');
  form.onsubmit = async e => {
    e.preventDefault(); if (readOnly) return;
    const data = readForm(form, fields);
    const miss = fields.filter(f => f.req && (data[f.k] === '' || data[f.k] == null));
    const err = ov.querySelector('#merr');
    if (miss.length) { err.hidden = false; err.textContent = 'Champ obligatoire : ' + miss.map(f => f.label).join(', ') + '.'; form.elements[miss[0].k].focus(); return; }
    const b = ov.querySelector('#msub'); b.disabled = true;
    try { const r = await onSubmit(data); if (r === false) b.disabled = false; else closeModal(); } catch (x) { b.disabled = false; }
  };
  if (onDelete && !readOnly) {
    const d = ov.querySelector('#mdel');
    d.onclick = async () => {
      if (d.dataset.armed) { d.disabled = true; try { await onDelete(); closeModal(); } catch (x) { d.disabled = false; } }
      else { d.dataset.armed = '1'; d.textContent = 'Confirmer la suppression'; }
    };
  }
  return ov;
}
function armDelete(btn, label, fn) { btn.onclick = async () => { if (!btn.dataset.armed) { btn.dataset.armed = 1; btn.textContent = label; return; } btn.disabled = true; try { await fn(); } catch (e) { btn.disabled = false; } }; }

function go(m, s) {
  if (!MENU[m] || !R(m)) m = 'accueil';
  const subs = visibleSubs(m);
  if (!subs.some(x => x[0] === s)) s = subs[0][0];
  const changed = m !== cur.m || s !== cur.s;
  cur = {m, s}; if (changed) query = '';
  try { localStorage.setItem('emcv-route', m + '-' + s); } catch (e) {}
  const h = '#' + m + '-' + s; if (location.hash !== h) history.replaceState(null, '', h);

}

  let body;
  try { body = (VIEWS[cur.m + '_' + cur.s] || (() => ''))(); } catch (e) { console.error(e); body = emptyState('Affichage impossible', 'Rechargez la page.'); }
  el.innerHTML = `${top}<div class="head"><div><div class="crumb">${esc(M.sec || 'EMCV')}</div><h1>${esc(M.t)}</h1><p class="lead">${LEADS[cur.m] || ''}</p></div></div>
    ${subs.length > 1 ? `<div class="tabs" role="tablist">${subs.map(s => `<button type="button" role="tab" aria-selected="${s[0] === cur.s}" class="${s[0] === cur.s ? 'on' : ''}" data-sub="${s[0]}">${esc(s[1])}</button>`).join('')}</div>` : ''}
    ${banner}${ro}${body}`;
  $('#openSide').onclick = () => { side.classList.add('open'); scrim.classList.add('open'); const b = side.querySelector('button'); if (b) b.focus(); };
  el.querySelectorAll('[data-sub]').forEach(b => b.onclick = () => go(cur.m, b.dataset.sub));
  const tabs = el.querySelector('.tabs'), on = el.querySelector('.tabs .on');
  if (tabs && on) tabs.scrollLeft = Math.max(0, on.offsetLeft - tabs.offsetLeft - 16);
  const q = $('#q');
  if (q) { q.oninput = () => { query = q.value; render(); }; if (keep) { q.focus(); q.setSelectionRange(pos, pos); } }
  el.querySelectorAll('[data-act]').forEach(b => {
    const run = e => { e.stopPropagation(); ACT[b.dataset.act](b.dataset.id, b); };
    b.addEventListener('click', run);
    if (b.tagName === 'TR' || b.classList.contains('click')) b.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); run(e); } });
  });
  el.querySelectorAll('select[data-change]').forEach(s => s.addEventListener('change', () => ACT[s.dataset.change](s.value, s)));
  if (VIEWS.after) { VIEWS.after(); VIEWS.after = null; }
}

/* ---- GC ---- */

  const list = sortBy(V('gc'), 'ordre').filter(g => !query || [g.nom, g.tribu, (g.responsables || []).join(' ')].join(' ').toLowerCase().includes(query.toLowerCase()));

  + (list.length ? `<div class="cards">${list.map(g => { const m = S.fideles.filter(f => f.gcId === g.id).length; const r = (g.responsables || []).filter(Boolean).length; const l = sortBy(S.presences.filter(p => p.type === 'gc' && p.groupeId === g.id), 'periode').pop();
    return `<button class="card" type="button" data-act="gcOpen" data-id="${g.id}"><b>${esc(g.nom || 'GC')}</b><span class="meta">${g.tribu ? 'Tribu : ' + esc(g.tribu) : 'Nom de la tribu à renseigner'}</span><span class="meta">${m} membre${m > 1 ? 's' : ''} · ${r} / 5 responsables</span><span class="meta">${l ? 'Présences du ' + frDate(l.periode) + ' : ' + (l.absents || []).length + ' abs.' : 'Aucune présence relevée'}</span></button>`; }).join('')}</div>` : `<section class="panel">${emptyState(loading() ? 'Chargement…' : 'Aucun GC', 'Ajoutez les groupes de communion.')}</section>`);
};
VIEWS.gc_presences = () => {
  const rel = sortBy(S.presences.filter(p => p.type === 'gc' && V('gc').some(g => g.id === p.groupeId)), 'periode', -1).slice(0, 60);
  return `<p class="lead" style="margin:0">Derniers relevés de présence. Ouvrez un GC depuis « Groupes de communion » pour faire un relevé.</p>
  <section class="panel">${rel.length ? table(['Date', 'GC', ['Présents', 'num'], ['Absents', 'num'], 'Absents'], rel.map(p => `<tr class="click" tabindex="0" data-act="gcOpen" data-id="${p.groupeId}"><td>${frDate(p.periode)}</td><td><b>${esc(gcLabel(byId('gc', p.groupeId)))}</b></td><td class="num">${p.presents ?? '—'}</td><td class="num">${(p.absents || []).length}</td><td class="muted">${esc((p.absents || []).map(i => fullName(byId('fideles', i))).join(', '))}</td></tr>`)) : emptyState('Aucun relevé', 'Les présences enregistrées dans chaque GC apparaîtront ici.')}</section>`;
};
VIEWS.gc_passages = () => {
  const all = []; V('gc').forEach(g => (g.passages || []).forEach(p => all.push({...p, g})));
  const list = sortBy(all, 'date', -1);
  return `<section class="panel">${list.length ? table(['Date', 'GC', 'Service'], list.map(p => `<tr class="click" tabindex="0" data-act="gcOpen" data-id="${p.g.id}"><td>${p.date >= today() ? pill(frDate(p.date), 'a') : frDate(p.date)}</td><td><b>${esc(gcLabel(p.g))}</b></td><td>${esc(p.note || 'Passage de service')}</td></tr>`)) : emptyState('Aucun passage de service', 'Planifiez les passages depuis la fiche de chaque GC.')}</section>`;
};

};
VIEWS.priere_requetes = () => entList('prieres', {flt: r => r.statut !== 'Exaucée'});
VIEWS.priere_temoignages = () => entList('prieres', {flt: r => r.statut === 'Exaucée', noAdd: true, lead: 'Requêtes exaucées et témoignages reçus.'});
VIEWS.enfants_inscrits = () => entList('enfants');
VIEWS.enfants_pointage = () => {
  const date = UI.pointageDate || today();
  const p = S.pointages.find(x => x.id === date) || {presents: [], recuperes: []};
  const pres = new Set(p.presents || []), rec = new Set(p.recuperes || []);

  return `<div class="toolbar"><div class="actions"><label for="pdate" class="muted" style="font-weight:600;font-size:12.5px">Dimanche du</label><input class="sel" type="date" id="pdate" value="${date}"></div><div class="actions">${pill(pres.size + ' présents', 'a')} ${enSalle ? pill(enSalle + ' encore en salle', 'w') : pres.size ? pill('Tous récupérés', 'g') : ''}</div></div>
  <section class="panel">${list.length ? table(['Enfant', 'Classe d\'âge', 'Parent', 'Code', 'Arrivée', 'Sortie'], list.map(e => `<tr><td><b>${esc(e.nom)}</b></td><td>${esc(e.groupe || '—')}</td><td>${esc(e.parent)}<br><span class="mono muted">${esc(e.contact || '')}</span></td><td class="mono">${esc(e.code || '—')}</td>
    <td>${w ? `<button class="btn sm" type="button" data-act="pointe" data-id="${e.id}" data-k="presents">${pres.has(e.id) ? 'Présent ✓' : 'Pointer'}</button>` : (pres.has(e.id) ? pill('Présent', 'a') : '—')}</td>
    <td>${pres.has(e.id) ? (w ? `<button class="btn sm" type="button" data-act="pointe" data-id="${e.id}" data-k="recuperes">${rec.has(e.id) ? 'Récupéré ✓' : 'Remettre au parent'}</button>` : (rec.has(e.id) ? pill('Récupéré', 'g') : pill('En salle', 'w'))) : '—'}</td></tr>`)) : emptyState(loading() ? 'Chargement…' : 'Aucun enfant inscrit', 'Inscrivez d\'abord les enfants.')}</section>
  <p class="muted" style="margin:0;font-size:12.5px">Avant de remettre un enfant, vérifiez que le parent présente le bon code.</p>`;

VIEWS.rdv_avenir = () => entList('rdv', {flt: r => r.date >= today() && r.statut !== 'Fait'});
VIEWS.rdv_historique = () => entList('rdv', {flt: r => r.date < today() || r.statut === 'Fait', noAdd: true});

VIEWS.agenda_avenir = () => entList('evenements', {flt: e => (e.dateFin || e.date) >= today()});
VIEWS.agenda_historique = () => entList('evenements', {flt: e => (e.dateFin || e.date) < today(), noAdd: true, lead: 'Activités passées. Ouvrez une activité pour noter son bilan.'});

  const c = sortBy(S.comptages, 'date', -1).slice(0, 8);

  return kpiRow([['Moyenne des 8 derniers comptages', c.length ? avg : '—'], ['Nouveaux (8 derniers)', c.reduce((a, x) => a + (Number(x.nouveaux) || 0), 0)]]) + entList('comptages');

VIEWS.culte_accueil = () => entList('accueil');
VIEWS.evenements_inscriptions = () => {
  const ev = sortBy(S.evenements.filter(e => ['Convention','Séminaire','Retraite','Croisade','Formation'].includes(e.type) || e.frais), 'date', -1);
  const sum = ev.slice(0, 4).map(e => { const ins = S.inscriptions.filter(i => i.evenementId === e.id); return [e.titre, ins.length + ' inscrit' + (ins.length > 1 ? 's' : ''), money(ins.reduce((a, i) => a + (Number(i.montant) || 0), 0)) + ' encaissés']; });
  return (sum.length ? kpiRow(sum) : '') + entList('inscriptions', {lead: ev.length ? '' : 'Programmez d\'abord l\'événement dans l\'Agenda (convention, séminaire, retraite), puis inscrivez les participants ici.'});
};
VIEWS.evenements_transport = () => {
  const g = {}; S.inscriptions.forEach(i => { const e = byId('evenements', i.evenementId); if (!e) return; const k = e.id + '|' + (i.car || 'Sans car') + '|' + (i.depart || '—'); g[k] = g[k] || {e, car: i.car || 'Sans car', depart: i.depart || '—', n: 0}; g[k].n++; });
  const list = Object.values(g).sort((a, b) => (b.e.date || '').localeCompare(a.e.date || '') || a.car.localeCompare(b.car));
  return `<section class="panel">${list.length ? table(['Événement', 'Car', 'Point de départ', ['Passagers', 'num']], list.map(x => `<tr><td><b>${esc(x.e.titre)}</b> <span class="muted">${frDate(x.e.date)}</span></td><td>${esc(x.car)}</td><td>${esc(x.depart)}</td><td class="num">${x.n}</td></tr>`)) : emptyState('Aucun transport organisé', 'Renseignez le car et le point de départ dans les inscriptions.')}</section>`;
};
VIEWS.evangelisation_sorties = () => {
  const s = S.sorties;
  return kpiRow([['Sorties', s.length], ['Personnes rencontrées', s.reduce((a, x) => a + (Number(x.rencontres) || 0), 0)], ['Contacts recueillis', s.reduce((a, x) => a + (x.contacts || '').split('\n').filter(l => l.trim()).length, 0)]]) + entList('sorties');
};
VIEWS.evangelisation_contacts = () => {
  const all = []; sortBy(S.sorties, 'date', -1).forEach(s => (s.contacts || '').split('\n').map(l => l.trim()).filter(Boolean).forEach((l, i) => all.push({s, l, i})));
  const w = W('adnh') || W('evangelisation');
  return `<p class="lead" style="margin:0">Chaque contact peut être transmis à l'ADNH pour être appelé et intégré.</p><section class="panel">${all.length ? table(['Sortie', 'Contact', ''], all.map(x => { const sent = (x.s.transmis || []).includes(x.i); return `<tr><td>${frDate(x.s.date)} · ${esc(x.s.lieu)}</td><td>${esc(x.l)}</td><td style="text-align:right">${sent ? pill('Transmis à l\'ADNH', 'g') : w ? `<button class="btn sm" type="button" data-act="transmettre" data-id="${x.s.id}" data-i="${x.i}">Transmettre à l'ADNH</button>` : ''}</td></tr>`; })) : emptyState('Aucun contact recueilli', 'Les contacts saisis dans les sorties apparaissent ici.')}</section>`;
};
const CER = {baptemes:['Baptême'], saintecene:['Sainte-Cène'], mariages:['Mariage', 'Présentation d\'enfant'], consecrations:['Consécration'], obseques:['Obsèques']};
Object.keys(CER).forEach(k => VIEWS['ceremonies_' + k] = () => entList('ceremonies', {flt: r => CER[k].includes(r.type), newDefaults: {type: CER[k][0], date: today()}}));

VIEWS.reunions_historique = () => entList('reunions', {lead: 'Historique de toutes les réunions : date, instance, objet, points discutés, décisions et tâches.'});
VIEWS.reunions_objets = () => {
  const list = sortBy(S.reunions, 'date', -1).filter(r => !query || [r.objet, r.discussions].join(' ').toLowerCase().includes(query.toLowerCase()));

  ${list.length ? list.map(r => { const pts = (r.discussions || '').split('\n').map(s => s.trim()).filter(Boolean); return `<section class="panel"><header><h2>${esc(r.objet)}</h2><div class="actions">${pill(r.instance, 'n')}<span class="muted">${frDate(r.date)}</span><button class="link" type="button" data-act="ent" data-ent="reunions" data-id="${r.id}">Ouvrir</button></div></header><div class="body">${pts.length ? `<ol style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px">${pts.map(p => `<li>${esc(p)}</li>`).join('')}</ol>` : '<p class="muted" style="margin:0">Aucun point noté pour cette réunion.</p>'}</div></section>`; }).join('') : `<section class="panel">${emptyState(loading() ? 'Chargement…' : query ? 'Aucun résultat' : 'Aucune réunion', 'Les objets et les points et dimensions discutés de chaque réunion apparaîtront ici.')}</section>`}`;

VIEWS.reunions_taches = () => {
  const t = S.taches, f = UI.tachesFlt || 'nonfaites';

  return kpiRow([['Pas faites', t.filter(x => x.statut !== 'Terminée').length], ['En retard', t.filter(x => x.statut !== 'Terminée' && x.echeance && x.echeance < today()).length], ['Faites', t.filter(x => x.statut === 'Terminée').length]])
    + `<div class="actions" role="group" aria-label="Filtrer les tâches">${[['nonfaites', 'Pas faites'], ['faites', 'Faites'], ['toutes', 'Toutes']].map(([k, l]) => `<button class="btn sm${f === k ? ' primary' : ''}" type="button" data-act="tachesFlt" data-id="${k}" aria-pressed="${f === k}">${l}</button>`).join('')}</div>`
    + entList('taches', {flt});
};
VIEWS.reunions_decisions = () => {
  const all = []; sortBy(S.reunions, 'date', -1).forEach(r => (r.decisions || '').split('\n').map(l => l.trim()).filter(Boolean).forEach(d => all.push({r, d})));
  const list = all.filter(x => !query || (x.d + ' ' + x.r.objet).toLowerCase().includes(query.toLowerCase()));
  return `<div class="toolbar">${searchBox('Rechercher une décision')}</div><section class="panel">${list.length ? table(['Date', 'Instance', 'Réunion', 'Décision'], list.map(x => `<tr class="click" tabindex="0" data-act="ent" data-ent="reunions" data-id="${x.r.id}"><td>${frDate(x.r.date)}</td><td>${pill(x.r.instance, 'n')}</td><td>${esc(x.r.objet)}</td><td><b>${esc(x.d)}</b></td></tr>`)) : emptyState('Aucune décision', 'Les décisions notées dans les comptes rendus apparaissent ici.')}</section>`;
};
VIEWS.pilotage_departements = () => {
  const mois = today().slice(0, 7);
  const deps = sortBy(V('departements'), 'ordre');
  return `<p class="lead" style="margin:0">Suivi opérationnel de chaque département : responsable, effectif, service à venir, dernier rapport et objectifs.</p>
  <section class="panel">${deps.length ? table(['Département', 'Responsable', ['Membres', 'num'], ['Créneaux à venir', 'num'], 'Rapport du mois', 'Objectifs'], deps.map(d => {
    const rap = sortBy(S.rapportsdep.filter(r => r.departementId === d.id), 'periode', -1)[0];
    const obj = S.objectifs.filter(o => o.departementId === d.id);

    return `<tr class="click" tabindex="0" data-act="dep" data-id="${d.id}"><td><b>${esc(d.nom)}</b></td><td>${esc(d.responsable || '—')}</td><td class="num">${(d.membres || []).length}</td><td class="num">${S.planning.filter(p => p.departementId === d.id && p.date >= today()).length}</td><td>${rap && rap.periode === mois ? pill(rap.statut || 'Soumis', rap.statut === 'Validé' ? 'g' : 'w') : pill(rap ? 'Dernier : ' + frMonth(rap.periode) : 'Aucun rapport', 'b')}</td><td>${obj.length ? `${att} / ${obj.length} atteint${att > 1 ? 's' : ''}` : '<span class="muted">—</span>'}</td></tr>`;
  })) : emptyState(loading() ? 'Chargement…' : 'Aucun département', 'Ajoutez les départements.')}</section>`;

VIEWS.pilotage_rapports = () => entList('rapportsdep', {lead: 'Rapports mensuels remis par les responsables de département.'});
VIEWS.departements_rapports = () => entList('rapportsdep');
VIEWS.agenda_calendrier = () => {
  const y = Number(UI.annee || today().slice(0, 4)), eg = UI.eglise || '';

  const mois = Array.from({length: 12}, (_, i) => y + '-' + String(i + 1).padStart(2, '0'));
  return `<div class="toolbar"><div class="actions"><button class="btn sm" type="button" data-act="annee" data-id="${y - 1}" aria-label="Année précédente">‹</button><b style="font-size:17px;min-width:56px;text-align:center">${y}</b><button class="btn sm" type="button" data-act="annee" data-id="${y + 1}" aria-label="Année suivante">›</button>
    <select class="sel" data-change="eglise" aria-label="Église"><option value="">Toutes les églises</option>${optEglises().map(([v, l]) => `<option value="${esc(v)}"${v === eg ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select></div>
    <div class="actions">${W('agenda') ? `<button class="btn primary" type="button" data-act="entNew" data-ent="evenements" data-def="${esc(JSON.stringify(eg ? {eglise: eg} : {}))}">+ Programmer une activité</button>` : ''}</div></div>
  <div class="grid2">${mois.map(m => { const l = sortBy(evs.filter(e => e.date.startsWith(m)), 'date'); const cur = m === today().slice(0, 7); return `<section class="panel"${cur ? ' style="border-color:var(--accent)"' : ''}><header><h2 style="text-transform:capitalize">${esc(frMonth(m))}</h2><span class="muted">${l.length} activité${l.length > 1 ? 's' : ''}</span></header>${l.length ? `<div class="body log">${l.map(e => `<div class="click" style="cursor:pointer" tabindex="0" data-act="ent" data-ent="evenements" data-id="${e.id}"><b>${Number(e.date.slice(8))}${e.dateFin && e.dateFin !== e.date ? '–' + Number(e.dateFin.slice(8)) : ''} · ${esc(e.titre)}</b><br><span class="muted">${esc([e.type, byId('eglises', e.eglise || defaultEglise())?.nom, e.lieu].filter(Boolean).join(' · '))}</span></div>`).join('')}</div>` : '<div class="body muted">Rien de programmé.</div>'}</section>`; }).join('')}</div>`;
};

/* ---- Finances et ressources ---- */
VIEWS.dons_encaissements = () => {
  const mois = today().slice(0, 7), y = today().slice(0, 4);
  const m = S.dons.filter(d => (d.date || '').startsWith(mois));
  const mm = m.filter(d => ['Orange Money','MTN MoMo','Moov Money','Wave'].includes(d.canal)).reduce((a, d) => a + (Number(d.montant) || 0), 0);
  const tot = m.reduce((a, d) => a + (Number(d.montant) || 0), 0);
  return kpiRow([['Ce mois', money(tot)], ['Dont Mobile Money', tot ? Math.round(mm / tot * 100) + ' %' : '—'], ['Depuis janvier', money(S.dons.filter(d => (d.date || '').startsWith(y)).reduce((a, d) => a + (Number(d.montant) || 0), 0))], ['À valider', S.dons.filter(d => d.statut !== 'Validé').length]])
    + (S.fonds.length ? '' : '<div class="banner info">Créez d\'abord les fonds (dîme, offrande, construction…) dans « Fonds et campagnes ».</div>') + entList('dons');
};
VIEWS.dons_fonds = () => entList('fonds');

async function copy(text, ok) {
  if (!text.trim()) { toast('Rien à copier.'); return; }
  try { await navigator.clipboard.writeText(text); toast(ok); }
  catch (e) { const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); toast('Sélectionnez puis copiez avec Ctrl+C'); setTimeout(() => t.remove(), 4000); }
}
async function resolveNames(ids) {
  if (!user || !ids.length) return;
  const miss = [...new Set(ids)];
  try { const ps = await user.profiles(miss); let ch = false; miss.forEach(i => { const n = ps[i]?.name || ''; if (n && NAMES[i] !== n) { NAMES[i] = n; ch = true; } }); if (ch) schedule(); } catch (e) {}
}

/* =================== Tableau de bord : graphiques =================== */
const MOIS_C = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const last12 = () => { const out = []; const d = new Date(); for (let i = 11; i >= 0; i--) { const x = new Date(d.getFullYear(), d.getMonth() - i, 1); out.push(x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0')); } return out; };
const mLabel = k => MOIS_C[Number(k.slice(5, 7)) - 1];
const fmtV = (v, f) => f === 'money' ? money(v) : (Math.round(v * 10) / 10).toLocaleString('fr-FR').replace(/ | /g, ' ');
/* Barres verticales, une seule série : pas de légende, le titre la nomme. */
function vbars(title, sub, data, f) {
  const W0 = 600, H0 = 230, L = 50, B = 30, T = 20, n = data.length, max = Math.max(1, ...data.map(d => d[1]));
  const step = (W0 - L - 8) / n, bw = Math.max(6, Math.min(34, step * 0.62));
  const nice = (() => { const p = Math.pow(10, Math.floor(Math.log10(max))); const m = max / p; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * p; })();
  const y = v => T + (H0 - T - B) * (1 - v / nice);
  const ticks = [0, nice / 2, nice];
  const iMax = data.reduce((bi, d, i) => d[1] > data[bi][1] ? i : bi, 0);
  const bars = data.map((d, i) => { const x = L + i * step + (step - bw) / 2, h = Math.max(0, y(0) - y(d[1])); const r = Math.min(4, h / 2, bw / 2);
    const path = h > 0 ? `M${x},${y(0)} V${y(d[1]) + r} Q${x},${y(d[1])} ${x + r},${y(d[1])} H${x + bw - r} Q${x + bw},${y(d[1])} ${x + bw},${y(d[1]) + r} V${y(0)} Z` : '';
    const lab = (i === n - 1 || i === iMax) && d[1] > 0 ? `<text x="${x + bw / 2}" y="${y(d[1]) - 6}" text-anchor="middle" class="cv">${esc(fmtV(d[1], f))}</text>` : '';
    return `<g class="bar"><rect x="${L + i * step}" y="${T}" width="${step}" height="${H0 - T - B}" fill="transparent"><title>${esc(d[0])} : ${esc(fmtV(d[1], f))}</title></rect>${path ? `<path d="${path}" fill="var(--accent)"><title>${esc(d[0])} : ${esc(fmtV(d[1], f))}</title></path>` : ''}${lab}<text x="${x + bw / 2}" y="${H0 - 9}" text-anchor="middle" class="cx">${esc(d[2] || d[0])}</text></g>`; }).join('');
  const grid = ticks.map(t => `<line x1="${L}" x2="${W0 - 4}" y1="${y(t)}" y2="${y(t)}" class="cg"/><text x="${L - 8}" y="${y(t) + 4}" text-anchor="end" class="cx">${esc(f === 'money' ? fmtK(t) : fmtV(t))}</text>`).join('');
  return `<section class="panel chart"><header><div><h2>${esc(title)}</h2>${sub ? `<span class="muted" style="font-size:12.5px">${esc(sub)}</span>` : ''}</div></header><div class="body"><div class="tw"><svg viewBox="0 0 ${W0} ${H0}" role="img" aria-label="${esc(title)}" style="width:100%;min-width:380px;height:auto;display:block">${grid}${bars}</svg></div>
  <details><summary>Voir le tableau</summary>${table(['Période', ['Valeur', 'num']], data.map(d => `<tr><td>${esc(d[0])}</td><td class="num">${esc(fmtV(d[1], f))}</td></tr>`))}</details></div></section>`;
}
const fmtK = v => v >= 1e6 ? (Math.round(v / 1e5) / 10).toString().replace('.', ',') + ' M' : v >= 1e3 ? Math.round(v / 1e3) + ' k' : String(v);

Thème demandé : ${RECO_THEMES[theme].t}.

Données de l'église (chiffres réels extraits du logiciel, sans données personnelles) :
${JSON.stringify(recoSummary(), null, 1)}

${rules}

Consignes :

- ${theme === 'alternatives' ? 'Pour chaque blocage, propose au moins deux alternatives réalistes et indique leurs avantages et limites.' : theme === 'objectifs' ? 'Pour chaque objectif en cours ou en retard, calcule le rythme nécessaire d\'ici l\'échéance et propose comment l\'atteindre.' : theme === 'problemes' ? 'Commence par les problèmes les plus urgents et propose une solution immédiate puis une solution durable.' : 'Appuie-toi sur les tendances (présence, intégration, finances) et sur les meilleures pratiques des églises.'}
- N'invente aucun chiffre : si une donnée manque, dis qu'elle doit être saisie dans le logiciel.
- Pas d'introduction ni de conclusion longues ; termine par une phrase de synthèse.`;
  iaCtrl = new AbortController(); UI.iaRun = theme; UI.iaText = ''; render();
  try {

  } catch (e) {
    if (e && e.code === 'not_granted') { UI.sampleOk = false; toast('Analyse non autorisée.'); }
    else if (e && e.code === 'cancelled') toast('Analyse arrêtée');
    else if (e && e.code === 'rate_limited') toast('Trop de demandes : réessayez dans quelques minutes.');
    else toast('L\'analyse a échoué, réessayez plus tard.');
    if (e && e.text) { try { await save('analyses', theme, {texte: e.text, date: today(), par: ME.id || ''}); } catch (x) {} }
  } finally { UI.iaRun = null; iaCtrl = null; render(); }
}

        ${w ? '<p class="muted" style="font-size:12.5px;margin:8px 0">Cochez les absents, puis enregistrez.</p><button class="btn primary sm" type="button" id="gPres">Enregistrer les présences</button>' : ''}</div>` : emptyState('Aucun membre', 'Ajoutez les membres du GC ou rattachez des fidèles existants.')}</section>
      <section class="panel"><header><h2>Passage de service</h2></header><div class="body" style="display:flex;flex-direction:column;gap:12px">
        ${w ? `<form id="psForm" class="form"><div class="field"><label for="ps-date">Date</label><input id="ps-date" type="date" value="${today()}"></div><div class="field"><label for="ps-note">Service</label><input id="ps-note" type="text" placeholder="Ex. accueil du culte du dimanche"></div><div class="field full"><button class="btn sm" type="submit">+ Ajouter un passage</button></div></form>` : ''}
        ${passages.length ? `<div class="log">${passages.map(p => `<div><b>${frDate(p.date)}</b><br><span class="muted">${esc(p.note || 'Passage de service')}</span></div>`).join('')}</div>` : '<p class="muted" style="margin:0">Aucun passage de service planifié.</p>'}
      </div></section>`,
    footer: `${w && ROLE.role !== 'resp_gc' ? '<button class="btn danger" type="button" id="gDel">Supprimer le GC</button>' : '<span></span>'}<button class="btn" type="button" data-cancel>Fermer</button>`
  });
  ov.querySelector('[data-cancel]').onclick = closeModal;
  const gd = ov.querySelector('#gDate'); if (gd) gd.onchange = () => openGc(id, gd.value || today());
  if (!w) return;
  ov.querySelector('#gcForm').onsubmit = async e => { e.preventDefault(); const f = e.target.elements; if (!f.nom.value.trim()) { toast('Le nom du GC est obligatoire.'); return; } await save('gc', id, {nom: f.nom.value.trim(), tribu: f.tribu.value.trim(), responsables: [0, 1, 2, 3, 4].map(i => f['r' + i].value.trim())}, true); toast('GC enregistré'); };
  ov.querySelector('#gAdd').onclick = () => openEnt('fideles', null, {gcId: id});
  const link = ov.querySelector('#gLink'); if (link) link.onchange = async () => { if (!link.value) return; await save('fideles', link.value, {gcId: id, tribu: g.tribu || ''}, true); toast('Membre rattaché'); openGc(id, date); };
  const gp = ov.querySelector('#gPres'); if (gp) gp.onclick = async () => { const absents = [...ov.querySelectorAll('[data-abs]:checked')].map(i => i.dataset.abs); gp.disabled = true; try { await save('presences', `gc_${id}_${date}`, {type: 'gc', groupeId: id, periode: date, absents, presents: membres.length - absents.length}); toast('Présences enregistrées'); openGc(id, date); } catch (e) { gp.disabled = false; } };
  ov.querySelector('#psForm').onsubmit = async e => { e.preventDefault(); await save('gc', id, {passages: [...(g.passages || []), {date: ov.querySelector('#ps-date').value || today(), note: ov.querySelector('#ps-note').value.trim()}]}, true); toast('Passage ajouté'); openGc(id, date); };
  const del = ov.querySelector('#gDel'); if (del) armDelete(del, 'Confirmer : les membres restent enregistrés', async () => { await remove('gc', id); toast('GC supprimé'); closeModal(); });
}

/* =================== Écrans d'accès =================== */
function gate(title, text) {
  $('.app').style.display = 'block'; side.style.display = 'none';
  $('#main').innerHTML = `<div class="gate"><svg viewBox="-6 -6 662 176" width="120" style="margin:0 auto" aria-hidden="true"><g fill="none" stroke-width="28" style="stroke:var(--ink)"><path d="M100 14 H14 V146 H100"/><path d="M14 80 H84"/><path d="M154 160 V14 L215 110 L276 14 V160"/><path d="M440.6 37.6 A66 66 0 1 0 440.6 122.4"/><path d="M510 14 L575 152 L640 14"/></g><g fill="none" stroke-width="11" style="stroke:var(--gold)"><path d="M452 54 V106"/><path d="M436 70 H468"/></g></svg><h1>${esc(title)}</h1><p class="lead" style="margin:0 auto">${text}</p></div>`;
}

/* =================== Démarrage =================== */
let tm = null;
function schedule() { clearTimeout(tm); tm = setTimeout(() => { if (!ROLE) return; renderNav(); render(); }, 40); }
let started = false;
function applyRole() {
  const r = ME.id ? byId('roles', ME.id) : null;
  if (ME.isOwner || ME.canEdit) ROLE = {...(r || {}), role: 'admin'};
  else if (r && ROLES[r.role]) ROLE = r;
  else ROLE = null;
}
function onData() {
  if (!started) return;
  const prev = ROLE && ROLE.role;
  applyRole();
  if (!ROLE) {
    if (!loaded.has('roles')) return;
    if (ME.id) { if (!byId('demandes', ME.id)) { db.collection('demandes').doc(ME.id).set({demandeLe: new Date().toISOString()}).catch(() => {}); } }
    gate('Accès en attente', ME.id ? `Bonjour${ME.name ? ' ' + esc(ME.name) : ''}. Votre demande d'accès a été transmise à l'administration de l'EMCV. Vous verrez vos menus dès qu'un rôle vous sera attribué.` : 'Connectez-vous à votre compte claude.ai de l\'organisation pour accéder à l\'application.');
    return;
  }
  if ($('.app').style.display === 'block') { $('.app').style.display = ''; side.style.display = ''; }
  if (prev !== ROLE.role && !R(cur.m)) go('accueil'); else schedule();
}

(async () => {
  const route = (location.hash.slice(1) || (() => { try { return localStorage.getItem('emcv-route') || ''; } catch (e) { return ''; } })()).split('-');
  if (route[0] && MENU[route[0]]) cur = {m: route[0], s: route[1] || ''};
  try { [db, user] = await Promise.all([window.claude?.use ? window.claude.use('db') : null, window.claude?.use ? window.claude.use('user') : null]); } catch (e) {}
  if (user) { try { ME = await user.me(); } catch (e) {} }
  if (!db) { dbState = 'off'; ROLE = {role: 'membre'}; started = true; go(cur.m, cur.s); return; }
  dbState = 'on';
  COLLS.forEach(c => {
    const q = c === 'presences' ? db.collection(c).orderBy('periode', 'desc').limit(1000) : db.collection(c);
    q.onSnapshot(snap => { S[c] = snap.docs.filter(d => d.exists).map(d => ({...d.data(), id: d.id})); loaded.add(c); onData(); },
      err => { loaded.add(c); if (err && err.code === 'revoked') dbState = 'off'; onData(); });
  });
  started = true;
  applyRole();
  if (ROLE) go(R(cur.m) ? cur.m : 'accueil', cur.s); else gate('Chargement…', 'Vérification de votre accès.');
  const usearchWire = () => {
    const i = $('#usearch'); if (!i || i.dataset.w) return; i.dataset.w = 1;
    const box = $('#uhits');
    const run = async () => { if (!user) return; const hits = await user.search(i.value.trim()); hits.forEach(h => NAMES[h.id] = h.name); box.hidden = !hits.length; box.innerHTML = ''; hits.forEach(h => { const b = document.createElement('button'); b.type = 'button'; const img = document.createElement('img'); img.src = h.avatarUrl; img.alt = ''; const s = document.createElement('span'); s.textContent = h.name + (byId('roles', h.id) ? ' · ' + (ROLES[byId('roles', h.id).role]?.l || '') : ''); b.append(img, s); b.onclick = () => ACT.roleEdit(h.id); box.appendChild(b); }); };
    i.addEventListener('input', run); i.addEventListener('focus', run);
  };
  new MutationObserver(usearchWire).observe($('#main'), {childList: true});
  document.addEventListener('change', e => { if (e.target.id === 'pdate') { UI.pointageDate = e.target.value || today(); render(); } });
})();
</script>
